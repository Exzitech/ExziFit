[package]
name = "exzifit"
version = "0.1.44"
edition = "2021"

[lib]
name = "exzifit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Mineures figées (~) et alignées sur les paquets npm @tauri-apps/* : sinon la CLI refuse de compiler.
[dependencies]
tauri = { version = "~2.11", features = [] }
# Minuteur de repos : notification programmée, seule à vibrer écran verrouillé.
tauri-plugin-notification = "~2.4"
# Nextcloud (maj.rs, envoi.rs) : mise à jour de l'APK, envoi des sauvegardes.
ureq = "2"
sha2 = "0.10"
# Synchro (synchro.rs) : authentification WebDAV ; déjà tirée par ureq, même version.
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
